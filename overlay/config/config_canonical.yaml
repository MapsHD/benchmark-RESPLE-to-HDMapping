# Benchmark canonical bag (Hesai QT64 as sensor_msgs/PointCloud2: x y z intensity,
# ring, float32 time [s] relative to the header stamp, uint32 t [ns]; IMU in the
# lidar frame). RESPLE's own config_eee02.yaml (NTU VIRAL, Ouster, spinning,
# lidar-only) with only the sensor description changed: topics; the Ouster type
# reads the uint32 `t` (ns); scan_line 64; blind 0.5; identity lidar-body
# extrinsic; lidar_time_offset 0 (lidar and IMU share one clock). RESPLE has no
# maximum range.
/**:
  ros__parameters:
    topic_imu: /lidar/imu
    acc_ratio: false  
    lidars: ["Ouster"]
    Ouster:
      topic_lidar: /lidar/pointcloud
      lidar_type: Ouster
      scan_line: 64
      blind: 0.5
      q_lb: [1.0, 0.0, 0.0, 0.0]      
      t_lb: [0.0, 0.0, 0.0]    
      w_pt: 0.01 
    lidar_time_offset: 0.0

    knot_hz: 100
    if_lidar_only: true  
    
    ds_scan_voxel: 0.5
    point_filter_num: 3
    nn_thresh: 0.5
    coeff_cov: 3.0
    num_nn: 8

    ds_lm_voxel: 0.5
    cube_len: 1000.0

    cov_P0: 0.02
    cov_RCP_pos_old: 0.1
    cov_RCP_ort_old: 0.1
    cov_RCP_pos_new: 1.0
    cov_RCP_ort_new: 1.0
    std_sys_pos: 0.2
    std_sys_ort: 0.1
    cov_acc: [1.0,1.0,1.0]
    cov_gyro: [0.1,0.1,0.1]     
    cov_ba: [0.2, 0.2, 0.2]
    cov_bg: [0.2, 0.2, 0.2]      
    n_iter: 1   
    num_points_upd: 500